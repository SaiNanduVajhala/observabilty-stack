global:
  resolve_timeout: 1m

route:
  group_by: ["alertname", "job", "severity"]
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: "local-webhook"
  routes:
    - match:
        severity: critical
      receiver: "local-webhook"
      continue: true

receivers:
  - name: "local-webhook"
    webhook_configs:
      - url: "http://sample-app:8000/health"
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname", "job"]
