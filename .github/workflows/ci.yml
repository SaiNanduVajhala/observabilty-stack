name: Observability Stack CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-validate:
    name: Lint & Validation Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linting Tools
        run: |
          pip install yamllint

      - name: Validate YAML files (yamllint)
        run: |
          yamllint -c .yamllint.yml .

      - name: Validate JSON Dashboards
        run: |
          python -c '
          import json, glob, sys
          files = glob.glob("grafana/dashboards/*.json")
          if not files:
              print("No dashboard JSON files found!")
              sys.exit(1)
          for f in files:
              print(f"Validating {f}...")
              with open(f, "r") as fp:
                  data = json.load(fp)
                  assert "panels" in data, f"{f} missing panels"
                  assert "title" in data, f"{f} missing title"
          print("All dashboards are valid JSON!")
          '

      - name: Validate Docker Compose Config
        run: |
          docker compose config

      - name: Validate Prometheus Scrape Config & Rules (promtool)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/prometheus:/etc/prometheus \
            prom/prometheus:v2.54.1 \
            promtool check config /etc/prometheus/prometheus.yml

      - name: Validate Prometheus Alert Rules (promtool)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/prometheus:/etc/prometheus \
            prom/prometheus:v2.54.1 \
            promtool check rules /etc/prometheus/alert.rules.yml

      - name: Validate Alertmanager Config (amtool)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/alertmanager:/etc/alertmanager \
            prom/alertmanager:v0.27.0 \
            amtool check-config /etc/alertmanager/alertmanager.yml

      - name: Syntax Check App & Loadgen Scripts
        run: |
          python -m py_compile app/app.py loadgen/loadgen.py
